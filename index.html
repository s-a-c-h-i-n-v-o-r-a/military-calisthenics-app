<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Daily Military Calisthenics</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root { --bg: #0d0d0d; --card: #1a1a1a; --accent: #00aaff; --text: #f0f0f0; --muted: #aaa; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 12px; line-height: 1.45; max-width: 480px; margin: 0 auto; }
  h1 { font-size: 1.4rem; color: var(--accent); margin: 8px 0; }
  h2 { font-size: 1.15rem; color: var(--accent); margin: 14px 0 8px; }
  .card { background: var(--card); border-radius: 12px; padding: 14px; margin: 10px 0; }
  button { background: var(--accent); color: #000; border: none; padding: 12px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; margin: 6px 0; font-size: 1rem; }
  .timer { font-size: 2.6rem; font-weight: bold; text-align: center; color: #0f0; margin: 10px 0; }
  .ex { margin: 12px 0; padding-bottom: 8px; border-bottom: 1px solid #333; }
  .ex img { width: 100%; border-radius: 8px; margin: 6px 0; max-height: 200px; object-fit: cover; }
  .steps { font-size: 0.9rem; margin: 6px 0; }
  .steps li { margin: 4px 0; }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .tabs button { flex: 1; }
  .hidden { display: none; }
  .current { background: #1e3a5f; border-left: 4px solid #00aaff; padding: 8px; border-radius: 6px; margin: 8px 0; }
</style>
</head>
<body>
<h1>Military Calisthenics Daily</h1>
<p class="small">52 · 5'5.5" · 149 → <145 lbs</p>
<div class="tabs">
  <button onclick="showTab('plan')">Plan</button>
  <button onclick="showTab('workout')">Workout</button>
  <button onclick="showTab('tracker')">Tracker</button>
</div>
<div id="plan" class="tab">
  <div class="card">
    <h2>Daily Structure (30 min)</h2>
    <p><strong>6 min</strong> Guided warm-up<br><strong>15 min</strong> Circuit (2 rounds · 40s / 20s)<br><strong>9 min</strong> Yoga / cool-down</p>
  </div>
</div>
<div id="workout" class="tab hidden">
  <div class="card">
    <h2>1. Warm-up (6 min guided)</h2>
    <div id="warmupList"></div>
    <button onclick="startWarmup()">Start Guided Warm-up</button>
    <div class="timer" id="warmupTimer">Ready</div>
    <div id="warmupCurrent" class="current"></div>
  </div>
  <div class="card">
    <h2>2. Circuit (15 min)</h2>
    <div id="exercises"></div>
    <button onclick="startCircuit()">Start Guided Circuit</button>
    <div class="timer" id="timerDisplay">Ready</div>
    <div id="currentExercise" class="current"></div>
  </div>
  <div class="card">
    <h2>3. Yoga (9 min)</h2>
    <div id="yogaList"></div>
    <button onclick="startYoga()">Start Guided Yoga</button>
    <div class="timer" id="yogaTimer">Ready</div>
    <div id="yogaCurrent" class="current"></div>
  </div>
</div>
<div id="tracker" class="tab hidden">
  <div class="card">
    <h2>Weight Log</h2>
    <input type="number" id="weight" step="0.1" value="149" style="width:100%;padding:10px;background:#222;color:#fff;border:1px solid #444;border-radius:6px;">
    <button onclick="logWeight()">Log Today's Weight</button>
    <div id="weightHistory"></div>
  </div>
  <div class="card">
    <h2>Log Session</h2>
    <select id="pushVar" style="width:100%;padding:10px;background:#222;color:#fff;border:1px solid #444;border-radius:6px;"><option>Knee</option><option selected>Standard</option><option>Diamond</option></select>
    <input type="number" id="pushPerf" placeholder="Push reps" style="width:100%;padding:10px;background:#222;color:#fff;border:1px solid #444;border-radius:6px;">
    <select id="squatVar" style="width:100%;padding:10px;background:#222;color:#fff;border:1px solid #444;border-radius:6px;"><option selected>Bodyweight</option><option>Chair</option></select>
    <input type="number" id="squatPerf" placeholder="Squat reps" style="width:100%;padding:10px;background:#222;color:#fff;border:1px solid #444;border-radius:6px;">
    <button onclick="logSession()">Save Session</button>
    <div id="adaptation"></div>
  </div>
  <div class="card"><h2>Recent Sessions</h2><div id="history"></div></div>
</div>
<script>
const warmup = [
  { name: "Arm Circles", time: 30, img: "I1iij.jpg", steps: ["Stand tall. Arms out to sides.", "Small circles forward 15s, then reverse 15s.", "Keep shoulders relaxed."] },
  { name: "Leg Swings", time: 40, img: "Jdyk5.jpg", steps: ["Hold wall for balance.", "Swing one leg forward and back (20s each leg).", "Controlled motion. Don't force range."] },
  { name: "Cat-Cow", time: 45, img: "3MEQP.jpg", steps: ["Hands and knees.", "Inhale: drop belly, lift chest.", "Exhale: round spine, tuck chin. Slow."] },
  { name: "World's Greatest Stretch", time: 40, img: "UbBBb.jpg", steps: ["Deep lunge. Hands inside front foot.", "Rotate inside arm up. Hold 5s. Switch sides.", "Front knee over ankle."] },
  { name: "Easy Squats", time: 45, img: "Jdyk5.jpg", steps: ["Feet shoulder-width. Sit hips back.", "Chest up. Lower as comfortable.", "Stand and repeat at easy pace."] }
];
const exercises = [
  { name: "Push-ups", time: 40, img: "I1iij.jpg", steps: ["Body straight. Hands under shoulders.", "Lower chest toward floor. Push up.", "Knees ok if needed. Controlled."] },
  { name: "Squats", time: 40, img: "Jdyk5.jpg", steps: ["Feet shoulder-width. Hips back, chest up.", "Lower to comfortable depth.", "Drive through heels to stand."] },
  { name: "Reverse Lunges", time: 40, img: "UbBBb.jpg", steps: ["Step back. Both knees near 90°.", "Front knee over ankle. Push through front heel.", "Alternate legs."] },
  { name: "Plank", time: 40, img: "qzAto.jpg", steps: ["Straight line head to heels.", "Squeeze glutes. Don't sag.", "Breathe steadily."] },
  { name: "Glute Bridges", time: 40, img: "BLKXT.jpg", steps: ["Lie back, knees bent.", "Drive hips up. Squeeze glutes.", "Lower with control."] },
  { name: "Mountain Climbers", time: 40, img: "KOEdu.jpg", steps: ["Push-up position.", "Alternate knees to chest. Hips low.", "Controlled pace."] },
  { name: "Bird-Dog", time: 40, img: "Uv2ol.jpg", steps: ["Hands and knees. Opposite arm + leg.", "Keep hips level. No twist.", "Move slowly."] }
];
const yoga = [
  { name: "Downward Dog", time: 60, img: "8gOYg.jpg", steps: ["Hips high, inverted V.", "Press hands. Soft knees ok.", "Breathe and hold."] },
  { name: "Warrior II", time: 50, img: "jJu6M.jpg", steps: ["Wide stance. Front knee bent.", "Arms out. Gaze over front hand.", "Hold each side ~25s."] },
  { name: "Child's Pose", time: 60, img: "3MEQP.jpg", steps: ["Sit hips back to heels.", "Arms forward. Forehead down.", "Breathe slowly."] },
  { name: "Figure-4 Stretch", time: 50, img: "BLKXT.jpg", steps: ["Ankle over opposite knee.", "Gently pull supporting leg in.", "Hold each side. Back relaxed."] }
];
function showTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.add('hidden'));
  document.getElementById(name).classList.remove('hidden');
}
function renderList(arr, id) {
  document.getElementById(id).innerHTML = arr.map(e => `<div class="ex"><strong>${e.name}</strong> · ${e.time}s<img src="${e.img}" alt="${e.name}"><ol class="steps">${e.steps.map(s => `<li>${s}</li>`).join('')}</ol></div>`).join('');
}
renderList(warmup, 'warmupList');
renderList(exercises, 'exercises');
renderList(yoga, 'yogaList');
let interval;
function startGuided(list, timerId, currentId, label) {
  clearInterval(interval);
  let idx = 0, rem = list[0].time;
  const timer = document.getElementById(timerId);
  const curr = document.getElementById(currentId);
  function tick() {
    if (idx >= list.length) { timer.textContent = label + " complete"; curr.textContent = "Done."; clearInterval(interval); return; }
    curr.innerHTML = `<strong>${list[idx].name}</strong><br>${list[idx].steps[0]}`;
    timer.textContent = Math.floor(rem/60) + ":" + (rem%60).toString().padStart(2,"0");
    rem--;
    if (rem < 0) { idx++; if (idx < list.length) rem = list[idx].time; }
  }
  tick();
  interval = setInterval(tick, 1000);
}
function startWarmup() { startGuided(warmup, "warmupTimer", "warmupCurrent", "Warm-up"); }
function startCircuit() {
  const c = [];
  for (let r = 0; r < 2; r++) {
    exercises.forEach(ex => { c.push({...ex, time:40, name:`R${r+1} · ${ex.name}`}); c.push({name:"Rest", time:20, steps:["Breathe."], img:""}); });
  }
  startGuided(c, "timerDisplay", "currentExercise", "Circuit");
}
function startYoga() { startGuided(yoga, "yogaTimer", "yogaCurrent", "Yoga"); }
function logWeight() {
  const w = parseFloat(document.getElementById('weight').value); if (!w) return;
  let ws = JSON.parse(localStorage.getItem('weights') || '[]');
  ws.push({date: new Date().toLocaleDateString(), weight: w});
  localStorage.setItem('weights', JSON.stringify(ws));
  renderWeights();
}
function renderWeights() {
  const ws = JSON.parse(localStorage.getItem('weights') || '[]');
  const div = document.getElementById('weightHistory');
  if (!ws.length) { div.innerHTML = '<p>No entries yet.</p>'; return; }
  const last = ws[ws.length-1], first = ws[0];
  div.innerHTML = `<p>Latest: <strong>${last.weight} lbs</strong> (${(last.weight-first.weight).toFixed(1)} from first). Target <145.</p>`;
}
function logSession() {
  const entry = { date: new Date().toLocaleDateString(), pushVar: document.getElementById('pushVar').value, pushPerf: document.getElementById('pushPerf').value, squatVar: document.getElementById('squatVar').value, squatPerf: document.getElementById('squatPerf').value };
  let ss = JSON.parse(localStorage.getItem('sessions') || '[]');
  ss.push(entry); localStorage.setItem('sessions', JSON.stringify(ss));
  renderHistory();
  document.getElementById('adaptation').innerHTML = "Saved. Add 1-2 reps next time if easy.";
}
function renderHistory() {
  const ss = JSON.parse(localStorage.getItem('sessions') || '[]');
  document.getElementById('history').innerHTML = ss.slice(-6).reverse().map(s => `<div>${s.date}: ${s.pushVar} ${s.pushPerf} · ${s.squatVar} ${s.squatPerf}</div>`).join('') || '<p>No sessions yet.</p>';
}
renderWeights(); renderHistory(); showTab('plan');
</script>
</body>
</html>
